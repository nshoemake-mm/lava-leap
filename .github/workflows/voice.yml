# Makes the spoken clips (free Kokoro voice, no API key) whenever the word list changes.
name: Make voice clips
on:
  push:
    branches: [main]
    paths: [index.html, tools/voice/**]
  workflow_dispatch:
permissions:
  contents: write
concurrency: voice
jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Kokoro model
        id: model
        uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-v1.0-int8
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/kokoro && cd ~/kokoro
          for f in kokoro-v1.0.int8.onnx voices-v1.0.bin; do
            curl -fsSL -o $f https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/$f
          done
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q kokoro-onnx==0.6.1 soundfile
      - run: python3 tools/voice/make_voice.py --model ~/kokoro
      - name: Commit new clips
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "No new clips"; exit 0; fi
          git config user.name "lava-leap-voice"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Voice clips for current words"
          git pull --rebase origin main
          git push
